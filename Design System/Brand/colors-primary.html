<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-display); background: #fff; padding: 20px; }
.swatches { display: flex; gap: 0; }
.swatch { flex: 1; height: 80px; display: flex; flex-direction: column; justify-content: flex-end; padding: 6px 8px; }
.swatch span { font-size: 10px; font-weight: 600; line-height: 1.3; }
.label-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.title { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #555; }
.hex { font-size: 10px; color: #999; font-family: monospace; }
</style>
</head>
<body>
<div class="label-row"><span class="title">Primary Green Scale</span></div>
<div class="swatches">
  <div class="swatch" style="background:#1b4d1e;border-radius:8px 0 0 8px;"><span style="color:#fff">900<br>#1b4d1e</span></div>
  <div class="swatch" style="background:#245227;"><span style="color:#fff">800<br>#245227</span></div>
  <div class="swatch" style="background:#2e7031;"><span style="color:#fff">700 ★<br>#2e7031</span></div>
  <div class="swatch" style="background:#3a8c3e;"><span style="color:#fff">600<br>#3a8c3e</span></div>
  <div class="swatch" style="background:#4caf50;"><span style="color:#fff">500<br>#4caf50</span></div>
  <div class="swatch" style="background:#66bb6a;"><span style="color:#1b4d1e">400 ✦<br>#66bb6a</span></div>
  <div class="swatch" style="background:#81c784;"><span style="color:#1b4d1e">300<br>#81c784</span></div>
  <div class="swatch" style="background:#a5d6a7;"><span style="color:#245227">200<br>#a5d6a7</span></div>
  <div class="swatch" style="background:#c8e6c9;"><span style="color:#245227">100<br>#c8e6c9</span></div>
  <div class="swatch" style="background:#f1f8f1;border:1px solid #e0e0e0;border-radius:0 8px 8px 0;"><span style="color:#245227">50<br>#f1f8f1</span></div>
</div>
<div style="margin-top:10px;font-size:10px;color:#999;font-family:monospace;">★ Brand Primary &nbsp; ✦ Accent</div>
</body>
</html>
