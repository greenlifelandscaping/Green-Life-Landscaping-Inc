<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-display); background: #fff; padding: 24px 28px; }
.hero-sample { font-family: var(--font-display); font-size: 52px; font-weight: 800; line-height: 1.1; letter-spacing: -0.02em; color: #1a1a1a; }
.hero-sample em { color: #2e7031; font-style: normal; }
.meta { font-size: 10px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: #9e9e9e; margin-bottom: 8px; font-family: var(--font-display); }
.sub { font-family: var(--font-body); font-size: 16px; color: #5a5a5a; line-height: 1.65; margin-top: 10px; max-width: 520px; }
.divider { border: none; border-top: 1px solid #e0e0e0; margin: 16px 0; }
</style>
</head>
<body>
<div class="meta">Display / Hero — Montserrat 800</div>
<div class="hero-sample">Transform Your<br><em>Outdoor Space</em></div>
<hr class="divider">
<div class="sub">Professional landscaping for Maryland homeowners and businesses. Reliable, eco-friendly, and built to last.</div>
<div style="margin-top:8px;font-size:10px;color:#bdbdbd;font-family:monospace;">Montserrat 800 / 52px / lh 1.1 / ls -0.02em &nbsp;|&nbsp; Body: Open Sans 400 / 16px / lh 1.65</div>
</body>
</html>
