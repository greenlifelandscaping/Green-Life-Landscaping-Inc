<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Montserrat', sans-serif; background: #f0f0f0; padding: 20px; }
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.logo-card { border-radius: 12px; padding: 24px 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
.logo-card img { max-width: 100%; max-height: 80px; object-fit: contain; }
.logo-label { font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; opacity: .55; }
.light { background: #fff; border: 1px solid #e0e0e0; }
.mid { background: #f1f8f1; border: 1px solid #c8e6c9; }
.dark { background: #1b4d1e; }
.dark .logo-label { color: #fff; }
.earth { background: #efebe9; border: 1px solid #d7ccc8; }
.photo-card { border-radius: 12px; overflow: hidden; position: relative; grid-column: span 1; }
.photo-card img { width: 100%; height: 120px; object-fit: cover; display: block; }
.photo-card .photo-label { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(transparent, rgba(0,0,0,0.55)); padding: 16px 10px 8px; font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #fff; }
</style>
</head>
<body>
<div class="grid">
  <div class="logo-card light">
    <img src="../assets/logo-primary.png" alt="Primary logo">
    <span class="logo-label">Primary</span>
  </div>
  <div class="logo-card mid">
    <img src="../assets/logo-dark-text.png" alt="Dark text logo">
    <span class="logo-label">Dark Text</span>
  </div>
  <div class="logo-card earth">
    <img src="../assets/logo-light-text.png" alt="Light text logo">
    <span class="logo-label">Light Variant</span>
  </div>
  <div class="logo-card dark">
    <img src="../assets/logo-primary.png" alt="Logo on dark" style="filter:brightness(10);">
    <span class="logo-label">On Dark</span>
  </div>
  <div class="photo-card">
    <img src="../assets/photo-tree-service.jpeg" alt="Tree service">
    <div class="photo-label">Tree Service</div>
  </div>
  <div class="photo-card">
    <img src="../assets/photo-team-owner.jpeg" alt="Team portrait">
    <div class="photo-label">Team Portrait</div>
  </div>
</div>
</body>
</html>
