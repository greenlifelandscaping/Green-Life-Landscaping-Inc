<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-display); background: #fff; padding: 20px 24px; }
.row { display: flex; align-items: baseline; gap: 16px; padding: 10px 0; border-bottom: 1px solid #f0f0f0; }
.row:last-child { border-bottom: none; }
.tag { font-size: 9px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #bdbdbd; width: 28px; flex-shrink: 0; }
.specimen { color: #1a1a1a; }
.spec { font-size: 9px; color: #bdbdbd; font-family: monospace; margin-left: auto; white-space: nowrap; }
</style>
</head>
<body>
<div class="row">
  <span class="tag">H1</span>
  <span class="specimen" style="font-family:var(--font-display);font-size:42px;font-weight:700;line-height:1.2;letter-spacing:-0.02em;">Reliable Landscaping</span>
  <span class="spec">Montserrat 700 / 42px</span>
</div>
<div class="row">
  <span class="tag">H2</span>
  <span class="specimen" style="font-family:var(--font-display);font-size:32px;font-weight:700;line-height:1.3;">Our Core Services</span>
  <span class="spec">Montserrat 700 / 32px</span>
</div>
<div class="row">
  <span class="tag">H3</span>
  <span class="specimen" style="font-family:var(--font-display);font-size:26px;font-weight:600;line-height:1.35;">Lawn Care & Maintenance</span>
  <span class="spec">Montserrat 600 / 26px</span>
</div>
<div class="row">
  <span class="tag">H4</span>
  <span class="specimen" style="font-family:var(--font-display);font-size:20px;font-weight:600;line-height:1.5;">Book a Free Estimate Today</span>
  <span class="spec">Montserrat 600 / 20px</span>
</div>
</body>
</html>
