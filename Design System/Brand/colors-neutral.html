<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-display); background: #fff; padding: 20px; }
.swatches { display: flex; gap: 0; }
.swatch { flex: 1; height: 80px; display: flex; flex-direction: column; justify-content: flex-end; padding: 6px 8px; }
.swatch span { font-size: 10px; font-weight: 600; line-height: 1.3; }
.title { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #555; margin-bottom: 10px; display: block; }
</style>
</head>
<body>
<span class="title">Neutral Scale</span>
<div class="swatches">
  <div class="swatch" style="background:#1a1a1a;border-radius:8px 0 0 8px;"><span style="color:#fff">900<br>#1a1a1a</span></div>
  <div class="swatch" style="background:#2c2c2c;"><span style="color:#fff">800<br>#2c2c2c</span></div>
  <div class="swatch" style="background:#3d3d3d;"><span style="color:#fff">700<br>#3d3d3d</span></div>
  <div class="swatch" style="background:#5a5a5a;"><span style="color:#fff">600<br>#5a5a5a</span></div>
  <div class="swatch" style="background:#757575;"><span style="color:#fff">500<br>#757575</span></div>
  <div class="swatch" style="background:#9e9e9e;"><span style="color:#fff">400<br>#9e9e9e</span></div>
  <div class="swatch" style="background:#bdbdbd;"><span style="color:#3d3d3d">300<br>#bdbdbd</span></div>
  <div class="swatch" style="background:#e0e0e0;"><span style="color:#3d3d3d">200<br>#e0e0e0</span></div>
  <div class="swatch" style="background:#f0f0f0;"><span style="color:#3d3d3d">100<br>#f0f0f0</span></div>
  <div class="swatch" style="background:#f8f8f6;border:1px solid #e0e0e0;border-radius:0 8px 8px 0;"><span style="color:#3d3d3d">50 ★<br>#f8f8f6</span></div>
</div>
<div style="margin-top:10px;font-size:10px;color:#999;font-family:monospace;">★ Page background (warm off-white)</div>
</body>
</html>
