<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-display); background: #fff; padding: 20px; }
.swatches { display: flex; gap: 0; }
.swatch { flex: 1; height: 80px; display: flex; flex-direction: column; justify-content: flex-end; padding: 6px 8px; }
.swatch span { font-size: 10px; font-weight: 600; line-height: 1.3; }
.label-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.title { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #555; }
</style>
</head>
<body>
<div class="label-row"><span class="title">Earth Brown Scale</span></div>
<div class="swatches">
  <div class="swatch" style="background:#3e2723;border-radius:8px 0 0 8px;"><span style="color:#fff">900<br>#3e2723</span></div>
  <div class="swatch" style="background:#4e342e;"><span style="color:#fff">800<br>#4e342e</span></div>
  <div class="swatch" style="background:#5d4037;"><span style="color:#fff">700<br>#5d4037</span></div>
  <div class="swatch" style="background:#6d4c41;"><span style="color:#fff">600 ★<br>#6d4c41</span></div>
  <div class="swatch" style="background:#795548;"><span style="color:#fff">500<br>#795548</span></div>
  <div class="swatch" style="background:#8d6e63;"><span style="color:#fff">400<br>#8d6e63</span></div>
  <div class="swatch" style="background:#a1887f;"><span style="color:#fff">300<br>#a1887f</span></div>
  <div class="swatch" style="background:#bcaaa4;"><span style="color:#3e2723">200<br>#bcaaa4</span></div>
  <div class="swatch" style="background:#d7ccc8;"><span style="color:#3e2723">100<br>#d7ccc8</span></div>
  <div class="swatch" style="background:#efebe9;border:1px solid #e0e0e0;border-radius:0 8px 8px 0;"><span style="color:#3e2723">50<br>#efebe9</span></div>
</div>
<div style="margin-top:10px;font-size:10px;color:#999;font-family:monospace;">★ Brand Secondary</div>
</body>
</html>
