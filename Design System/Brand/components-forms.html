<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Open Sans', sans-serif; background: #f8f8f6; padding: 20px 24px; }
.form { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); max-width: 480px; }
.form-row { display: flex; gap: 12px; margin-bottom: 12px; }
.form-group { flex: 1; display: flex; flex-direction: column; gap: 4px; }
label { font-family: 'Montserrat', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: .04em; color: #3d3d3d; text-transform: uppercase; }
.input-wrap { position: relative; display: flex; align-items: center; }
.input-wrap svg { position: absolute; left: 10px; color: #9e9e9e; pointer-events: none; }
input, select, textarea { width: 100%; font-family: 'Open Sans', sans-serif; font-size: 14px; color: #1a1a1a; background: #fff; border: 1.5px solid #e0e0e0; border-radius: 8px; padding: 9px 12px 9px 34px; outline: none; transition: border-color 200ms; }
input:focus, select:focus, textarea:focus { border-color: #2e7031; box-shadow: 0 0 0 3px rgba(46,112,49,0.10); }
select { padding-left: 34px; appearance: none; }
textarea { padding-left: 12px; min-height: 70px; resize: vertical; }
.btn-submit { background: #2e7031; color: #fff; font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 14px; letter-spacing: .04em; border: none; border-radius: 8px; padding: 12px 28px; cursor: pointer; width: 100%; margin-top: 4px; box-shadow: 0 4px 16px rgba(46,112,49,0.20); }
</style>
</head>
<body>
<div class="form">
  <div class="form-row">
    <div class="form-group">
      <label>Full Name</label>
      <div class="input-wrap"><i data-lucide="user" width="14" height="14"></i><input type="text" placeholder="John Smith"></div>
    </div>
    <div class="form-group">
      <label>Phone</label>
      <div class="input-wrap"><i data-lucide="phone" width="14" height="14"></i><input type="tel" placeholder="(410) 555-0100"></div>
    </div>
  </div>
  <div class="form-row">
    <div class="form-group">
      <label>Service Needed</label>
      <div class="input-wrap"><i data-lucide="list" width="14" height="14"></i>
        <select><option>Select a service…</option><option>Lawn Care</option><option>Tree Services</option><option>Hardscaping</option><option>Cleanups</option><option>Fence Work</option><option>Drainage</option></select>
      </div>
    </div>
  </div>
  <div class="form-group" style="margin-bottom:12px;">
    <label>Message</label>
    <textarea placeholder="Describe your project or property…"></textarea>
  </div>
  <button class="btn-submit">Book Free Estimate</button>
</div>
<script>lucide.createIcons();</script>
</body>
</html>
